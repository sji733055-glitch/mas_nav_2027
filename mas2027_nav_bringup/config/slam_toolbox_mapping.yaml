# 将 Small Point-LIO 去畸变并配准后的三维点云转换为二维激光，再由 SLAM Toolbox 建图。
# 本文件启用时的坐标变换发布关系：
#   Small Point-LIO 发布 odom -> base_link。
#   robot_state_publisher 发布 base_link -> lidar_link。
#   SLAM Toolbox 发布 map -> odom。
# 同一时间不能再启动其他 map -> odom 发布者，否则 TF 会跳变。

pointcloud_to_laserscan:
  ros__parameters:
    # 是否使用 /clock 仿真时间；实车使用 false，回放带 /clock 的 rosbag 时可设为 true。
    use_sim_time: false

    # 输出 LaserScan 所在坐标系；点云会先通过 TF 转换到此坐标系再做高度裁剪。
    target_frame: base_link
    # 等待点云时间戳对应 TF 的最长容差，单位秒；TF 偶发延迟时可适当增大。
    transform_tolerance: 0.10
    # 等待 TF 时可缓存的点云帧数；过小容易丢帧，过大会增加延迟和内存占用。
    queue_size: 10

    # base_link 坐标系下保留点的最低高度，单位米；增大可滤掉地面和车体低处。
    min_height: 0.10
    # base_link 坐标系下保留点的最高高度，单位米；减小可滤掉横梁、树冠等高处点。
    max_height: 1.50

    # 保留点的最小强度；Small Point-LIO 当前为 /cloud_registered 填写的强度固定为 0。
    min_intensity: 0.0
    # 保留点的最大强度；当前固定强度为 0，此值主要为以后保留真实强度预留。
    max_intensity: 255.0

    # 扫描起始方位角，单位弧度；-pi 表示从车体正后方的一侧开始。
    angle_min: -3.14159265
    # 扫描结束方位角，单位弧度；pi 与 angle_min 共同覆盖 360 度。
    angle_max: 3.14159265
    # 相邻激光束的角分辨率，单位弧度；当前约 0.5 度，减小会增加数据量。
    angle_increment: 0.00872665
    # 一帧二维扫描的名义周期，单位秒；应接近输入点云周期，0.10 秒对应 10 Hz。
    scan_time: 0.10

    # 输出的最近有效距离，单位米；增大可滤掉机器人自身和近距离噪声。
    range_min: 0.30
    # 输出的最远有效距离，单位米；减小可减少远距离稀疏点形成的假墙。
    range_max: 20.0
    # 无有效点的角度是否填正无穷；true 符合大多数二维导航算法的期望。
    use_inf: true
    # use_inf=false 时无有效点填为 range_max + 此值，单位米；use_inf=true 时不生效。
    inf_epsilon: 1.0

slam_toolbox:
  ros__parameters:
    # 是否使用 /clock 仿真时间；必须与点云转换器和 Small Point-LIO 的时间源一致。
    use_sim_time: false

    # 位姿图非线性优化插件；CeresSolver 是当前安装并使用的默认求解器。
    solver_plugin: solver_plugins::CeresSolver
    # Ceres 线性方程求解方式；稀疏 Cholesky 适合当前二维位姿图规模。
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    # Ceres 预条件器；主要影响大型位姿图的收敛速度和内存占用。
    ceres_preconditioner: SCHUR_JACOBI
    # Ceres 信赖域策略；LM 通常比纯高斯牛顿对初值更稳健。
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    # Dogleg 策略类型；仅当 ceres_trust_strategy 选择 DOGLEG 时生效。
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    # 鲁棒损失函数；None 不抑制离群约束，误回环较多时再考虑其他损失函数。
    ceres_loss_function: None

    # 局部连续里程计坐标系；由 Small Point-LIO 提供 odom -> base_link。
    odom_frame: odom
    # 全局地图坐标系；SLAM Toolbox 将发布 map -> odom。
    map_frame: map
    # 用于二维扫描匹配的机器人基准坐标系，必须能在扫描时间戳查询到 odom -> base_link。
    base_frame: base_link
    # 输入 LaserScan 话题；由 pointcloud_to_laserscan 发布。
    scan_topic: /scan
    # 工作模式；mapping 表示增量建图并允许回环优化。
    mode: mapping

    # 是否输出详细调试日志；开启会显著增加终端输出。
    debug_logging: false
    # 每多少帧输入扫描处理一帧；1 表示每帧处理，增大可降低 CPU 占用。
    throttle_scans: 1
    # map -> odom 的发布周期，单位秒；0.02 秒对应 50 Hz，减小会增加 TF 发布负担。
    transform_publish_period: 0.02
    # OccupancyGrid 地图更新周期，单位秒；减小可让 RViz 更新更快但增加 CPU 占用。
    map_update_interval: 2.0
    # 栅格地图分辨率，单位米/格；减小地图更细但内存和计算量更高。
    resolution: 0.05
    # SLAM 接受的最小激光距离，单位米；略高于 /scan 的 0.30 以避开 float32 边界告警。
    min_laser_range: 0.31
    # SLAM 接受的最大激光距离，单位米；不应大于 /scan 的 range_max。
    max_laser_range: 20.0
    # 两次实际处理扫描之间的最短时间，单位秒；减小会提高处理频率和 CPU 占用。
    minimum_time_interval: 0.10
    # 等待扫描时间戳对应坐标变换的超时时间，单位秒；TF 延迟时可适当增大。
    transform_timeout: 0.30
    # TF 缓冲区保存历史变换的时长，单位秒；处理延迟较大的 rosbag 时可增大。
    tf_buffer_duration: 30.0
    # SLAM Toolbox 线程栈大小，单位字节；复杂优化崩溃于栈不足时才需要增大。
    stack_size_to_use: 40000000
    # 是否允许 RViz 的交互式位姿图工具修改节点和约束。
    enable_interactive_mode: true
    # 是否启用 SLAM Toolbox 的地图保存相关服务。
    use_map_saver: true

    # 机器人至少平移此距离才创建新的扫描节点，单位米；减小会使关键帧更密但更耗 CPU。
    minimum_travel_distance: 0.10
    # 机器人至少旋转此角度才创建新的扫描节点，单位弧度；0.10 约为 5.7 度。
    minimum_travel_heading: 0.10
    # 是否用当前扫描修正里程计预测；关闭后主要依赖 Small Point-LIO 里程计。
    use_scan_matching: true
    # 扫描匹配是否使用点集重心帮助确定搜索中心；通常保持 true。
    use_scan_barycenter: true
    # 局部扫描匹配缓冲区保存的关键帧数量；增大更稳健但计算量更高。
    scan_buffer_size: 10
    # 缓冲关键帧相对当前位姿允许的最大距离，单位米；超过后不参与局部匹配。
    scan_buffer_maximum_scan_distance: 10.0
    # 建立相邻节点约束所需的最低精匹配响应；增大可减少弱约束，也可能漏掉有效约束。
    link_match_minimum_response_fine: 0.10
    # 尝试建立相邻扫描约束时允许的最大位姿距离，单位米。
    link_scan_maximum_distance: 1.50

    # 是否启用回环检测；关闭后长期漂移不会通过历史区域重访得到修正。
    do_loop_closing: true
    # 搜索回环候选关键帧的最大空间距离，单位米；增大提高召回率也增加误匹配和计算量。
    loop_search_maximum_distance: 3.0
    # 回环候选附近至少需要连续多少个历史关键帧；增大可降低偶然误回环。
    loop_match_minimum_chain_size: 10
    # 粗匹配结果允许的最大协方差；减小会更严格，也可能拒绝真实回环。
    loop_match_maximum_variance_coarse: 3.0
    # 回环粗匹配的最低响应阈值；增大可减少误回环。
    loop_match_minimum_response_coarse: 0.35
    # 回环精匹配的最低响应阈值；增大可减少误回环但可能降低回环召回率。
    loop_match_minimum_response_fine: 0.45

    # 普通扫描相关匹配的平移搜索窗口边长，单位米；里程计误差大时可适当增大。
    correlation_search_space_dimension: 0.5
    # 普通扫描相关匹配的平移搜索步长，单位米；减小更精细但计算量更高。
    correlation_search_space_resolution: 0.01
    # 普通扫描相关栅格的平滑标准差，单位米；增大可扩大匹配盆地但降低峰值分辨率。
    correlation_search_space_smear_deviation: 0.1

    # 回环粗搜索的平移窗口边长，单位米；增大可容忍更大漂移但计算量明显上升。
    loop_search_space_dimension: 8.0
    # 回环粗搜索的平移步长，单位米；减小更精细但更耗时。
    loop_search_space_resolution: 0.05
    # 回环相关栅格的平滑标准差，单位米；影响粗搜索对位姿误差的容忍度。
    loop_search_space_smear_deviation: 0.03

    # 扫描匹配对平移偏离里程计预测的惩罚系数；增大后结果更倾向里程计预测。
    distance_variance_penalty: 0.5
    # 扫描匹配对旋转偏离里程计预测的惩罚系数；增大后结果更倾向里程计预测。
    angle_variance_penalty: 1.0
    # 精匹配每次搜索的角度偏移，单位弧度；0.00349 约为 0.2 度。
    fine_search_angle_offset: 0.00349
    # 粗匹配覆盖的最大角度偏移，单位弧度；0.349 约为 20 度。
    coarse_search_angle_offset: 0.349
    # 粗匹配角度搜索步长，单位弧度；0.0349 约为 2 度。
    coarse_angle_resolution: 0.0349
    # 角度差惩罚的下限比例；越接近 1 越不允许大角度偏离预测。
    minimum_angle_penalty: 0.9
    # 距离差惩罚的下限比例；增大后更不允许大平移偏离预测。
    minimum_distance_penalty: 0.5
    # 匹配响应过弱时是否扩展搜索范围；开启可提高大误差下的成功率但增加计算量。
    use_response_expansion: true
